<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>YUDAI MASAKI</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="layout">
        <header class="sitebar">
            <p class="site-name">YUDAI MASAKI</p>
            <p class="affiliation">
                Undergraduate Student<br>
                <a href="https://www.media.lab.uec.ac.jp/">UEC Media Design Lab</a><br>The University of Electro-Communications</p>
        </header>

        <main class="works">
            <figure class="work">
                <div class="work-image">
                    <img src="assets/images/fuf.JPG">

                <div class="work-overlay">
                    <div class="work-text">
                        <p>This is an experience of building your own face.</p>
                        <p>Your mouth, nouse, and eyes have come apart.</p>
                        <p>You must search for the pieces and restore your true face.</p>
                        <br>
                        <p>
                            Recalling yourself in the mirror,or in photos taken with friends,
                            I hope this work offers a chance to recognize anew the face that has accompanied you—and
                            will continue to accompany you—through past, present, and future.
                        </p>

                        <p class="work-meta">
                            <a href="https://youtu.be/OtzNKVPBO50" target="_blank" class="youtube-link">
                              <img src="assets/images/youtube-logo.png">
                            </a>
                        </p>
                    </div>
                </div>
            </div>

            <figcaption>
                <p class="work-title">Familiar, Unfamiliar Face</p>
                <p class="work-meta">Interactive VR Installation, 2026</p>
            </figcaption>
            </figure>
        </main>
    </div>
</body>
</html>
