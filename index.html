<body>
    <div class="layout">
        <header class="sitebar">
            <p class="site-name">YUDAI MASAKI</p>

                Undergraduate Student<br>

        </header>

        <main class="works">
            <figure class="work">
                <div class="work-image">
                    <img src="assets/images/fuf.JPG" alt="Familiar, Unfamiliar Face — installation view">

                <div class="work-overlay">
                    <div class="work-text">
                        <p>This is an experience of rebuilding your own face.</p>
                        <p>
                            A photo of your face is turned into a 3D model with Gaussian Splatting. Wearing a headset, you face this model—its eyes, nose, and mouth missing—and search a table of physical parts, mixed with those of strangers, to put your face back together.
                        </p>
                        <p>
                            Recalling yourself in the mirror, or in photos taken with friends, I hope this work offers a chance to see anew the face that has stayed with you—through past, present, and future.
                        </p>

                        <a href="https://youtu.be/OtzNKVPBO50" target="_blank" class="youtube-link">
                            <img src="assets/images/youtube-logo.png" alt="Watch on YouTube">
                        </a>
                    </div>

                <dl class="work-history">
                    <dt>Upcoming</dt>
                    <dd>INTER BEE IGNITION × DCEXPO, Chiba, Japan, 2026</dd>
                    <dd>Laval Virtual, Laval, France, 2027</dd>

                    <dt>Exhibition</dt>
                    <dd>Interverse Virtual Reality Challenge, Toyama, Japan, 2026</dd>

                    <dt>Award</dt>
                    <dd>Mamoru Hosoda Prize, Interverse Virtual Reality Challenge, 2026</dd>
                    <dd>Laval Virtual Prize, Interverse Virtual Reality Challenge, 2026</dd>
                    <dd>Unity Award, Interverse Virtual Reality Challenge, 2026</dd>
                    <dd>DCEXPO Selection, Interverse Virtual Reality Challenge, INTER BEE IGNITION × DCEXPO, 2026</dd>
                </dl>
                </div>
            </div>

            <figcaption>
                <p class="work-title">Familiar, Unfamiliar Face</p>
                <p class="work-meta">Interactive VR Installation, 2026</p>
            </figcaption>
            </figure>
        </main>
    </div>
